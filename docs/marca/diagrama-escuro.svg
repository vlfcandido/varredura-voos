<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 503" width="100%" role="img" aria-labelledby="escuro-varredura-voos-largo-t escuro-varredura-voos-largo-d" preserveAspectRatio="xMidYMid meet" style="display:block;max-width:100%;height:auto"><title id="escuro-varredura-voos-largo-t">Busca de passagens que protege a cota da API</title><desc id="escuro-varredura-voos-largo-d">As janelas de feriado definem as datas. Antes de cada chamada, um orçamento de cota mensal e um cache de 12 horas evitam gasto; a API da Amadeus é chamada respeitando o limite de chamadas. Ofertas com ida ou volta acima do teto de duração saem antes do preço, e o resultado é um ranking em CSV.</desc><defs><marker id="escuro-varredura-voos-largo-pm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#6cc6d6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="escuro-varredura-voos-largo-pc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1.5 1.5L8.5 5L1.5 8.5" fill="none" stroke="#ff7a90" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="100%" height="100%" fill="#0b1e25"/><g aria-hidden="true"><path d="M770 513C770 429 848 399 902 405C962 411 1010 459 1010 513" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><path d="M808.4 513C808.4 455.88 861.44 435.48 898.16 439.56C938.96 443.64 971.6 476.28 971.6 513" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><path d="M844.4 513C844.4 481.08 874.04 469.68 894.56 471.96C917.36 474.24 935.6 492.48 935.6 513" fill="none" stroke="#2c4b55" stroke-width="1.2" opacity="0.8"/><text x="884" y="499" font-family="'Brygada 1918', Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#97b2b5" opacity="0.8">18</text></g><text x="46" y="39" font-family="'Brygada 1918', G
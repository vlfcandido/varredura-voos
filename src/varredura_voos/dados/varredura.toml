# Configuração padrão da varredura de voos.
# Tudo aqui é editável — nada disso está no código.

[viagem]
origens = ["CAC", "IGU"]
adultos = 2
moeda = "BRL"
classe = "ECONOMY"
# Teto de duração de CADA perna (ida e volta, separadamente).
max_duracao_horas = 6.0
# Janelas de viagem consideradas.
noites_fim_de_semana = 3        # sexta -> segunda
noites_feriado = [3, 4]

[destinos]
lista = [
  "GRU", "CGH", "VCP", "CWB", "FLN", "POA", "NVT", "JOI",
  "GIG", "SDU", "CNF", "BSB", "SSA", "REC", "MCZ", "NAT",
  "FOR", "JPA", "AJU", "IOS", "BPS", "VIX", "CGB", "CGR",
  "GYN", "UDI", "LDB", "MGF", "BEL", "SLZ", "THE", "MAO",
]

[cota]
# Ambiente de teste da Amadeus: 10 TPS, e cota mensal gratuita (confira o número
# real em My Self-Service Workspace > API usage and quota).
max_chamadas_mes = 1800
concorrencia = 8                # folga sobre o limite de 10 TPS
ttl_cache_horas = 12

[estimativa]
# Modelo do limite INFERIOR de duração, usado para podar rotas impossíveis
# antes de gastar chamada. Tem de ser otimista de propósito: só poda quando
# nem no melhor caso concebível a rota cabe no teto.
velocidade_cruzeiro_kmh = 800.0
overhead_voo_min = 30           # taxi, subida, descida
conexao_minima_min = 45         # tempo mínimo de conexão
# Conexão usada no modo de poda agressiva (--poda-agressiva). Mais realista,
# mas NÃO é um limite inferior seguro: pode esconder oferta válida.
conexao_realista_min = 90

[feriados]
# Derivados em runtime pela lib `holidays` (BR), categorias PUBLIC + OPTIONAL.
# OPTIONAL é obrigatório: Carnaval é ponto facultativo e não sai no PUBLIC.
categorias = ["PUBLIC", "OPTIONAL"]
# Facultativos que não geram viagem — removidos do resultado.
excluidos = [
  "Véspera de Natal",
  "Véspera de Ano-Novo",
  "Dia do Servidor Público",
  "Início da Quaresma",
]

# Rotas diretas conhecidas a partir de cada origem. Usadas só para estimar o
# limite inferior de duração; não restringem o que a API pode devolver.
[rotas_diretas]
CAC = ["GRU", "VCP", "CWB", "MCZ"]
# CONFIRMAR: lista montada por conhecimento de mercado, não medida.
IGU = ["GRU", "CGH", "VCP", "CWB", "GIG", "SDU", "POA", "FLN", "BSB", "CNF"]

